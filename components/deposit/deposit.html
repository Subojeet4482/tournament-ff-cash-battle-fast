<!-- DEPOSIT -->
<div id="modal-deposit" class="modal-wrap" data-payment-modal>
    <div class="modal-overlay" onclick="ui.closeModal()"></div>
    <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2 style="margin:0">Add Money</h2>
            <div onclick="ui.closeModal()" style="font-size:1.5rem; cursor:pointer; color:var(--text-muted);"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div id="dep-off" class="wd-off-box">
            <div class="wd-off-ico"><i class="fa-solid fa-ban"></i></div>
            <b>Deposit Disabled</b>
            <p id="dep-off-msg">Deposit is temporarily disabled. Please try again later.</p>
        </div>
        <div id="dep-upi-section">
            <div id="dep-qr-wrap" style="text-align:center; margin-bottom:15px; display:none;">
                <img id="dep-qr-img" alt="Payment QR code" src="" style="width:160px; height:160px; object-fit:contain; border-radius:12px; border:2px solid var(--border);">
                <div style="font-size:0.75rem; color:var(--text-muted); margin-top:5px;">Scan to Pay</div>
            </div>
            <p class="text-muted" style="font-size:0.8rem; margin-bottom:12px;"><i class="fa-solid fa-circle-info"></i> Send money via UPI, then enter the amount and your <b>UTR</b> or <b>Transaction ID</b>. Either one works.</p>
            <div class="pay-copy-box">
                <div>
                    <div style="font-size:0.7rem; color:var(--text-muted); text-transform:uppercase;">UPI ID</div>
                    <div class="pay-num" id="dep-upi-id">Loading...</div>
                </div>
                <div class="copy-btn" onclick="ui.copy(document.getElementById('dep-upi-id').innerText)"><i class="fa-regular fa-copy"></i> Copy</div>
            </div>
            <input type="number" id="dep-amount" class="input-box" placeholder="Amount Sent (Min ₹5)" min="5" oninput="app.validateAmount(this)">
            <div class="ref-field">
                <label class="ref-label" for="dep-utr"><i class="fa-solid fa-hashtag"></i> UTR <span>or</span> Transaction ID</label>
                <input type="text" id="dep-utr" class="input-box" placeholder="e.g. 412345678901 or FMPIB6862334894" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" oninput="app.onRefInput(this)">
                <div class="ref-detect" id="dep-ref-detect"><i class="fa-regular fa-circle"></i><span>Paste your UTR or the Transaction ID from your payment app</span></div>
            </div>
            <div id="dep-auto-status" style="display:none; margin-top:10px; padding:10px 12px; border-radius:10px; background:#f1f5f9; font-size:0.82rem; color:var(--text-muted);"></div>
            <button class="btn-main" onclick="app.deposit('upi')" style="margin-top:15px;"><i class="fa-solid fa-shield-check"></i> Verify &amp; Submit</button>
        </div>
    </div>
</div>
