<!-- BAN OVERLAY -->
<div id="ban-overlay" style="display:none" role="alertdialog" aria-labelledby="bo-title">
    <div class="bo-glow"></div>
    <div class="bo-wrap">
        <div class="bo-hero" aria-hidden="true">
            <span class="bo-ring"></span><span class="bo-ring bo-r2"></span><span class="bo-shock"></span>
            <svg class="bo-shield" viewBox="0 0 116 134">
                <path class="bo-body" d="M58 6 L104 22 V62 C104 94 84 117 58 128 C32 117 12 94 12 62 V22 Z"/>
                <path class="bo-slash" d="M38 48 L78 88"/>
                <path class="bo-crack" d="M58 6 L54 30 L64 44 L56 62"/>
            </svg>
        </div>
        <div class="bo-card">
            <div class="bo-badge"><span class="bo-dot"></span><span id="bo-status">Account banned</span></div>
            <h1 id="bo-title">You can’t play right now</h1>
            <p class="bo-sub" id="bo-sub"></p>

            <div class="bo-ref">
                <div><small>Banned Player ID</small><b id="bo-pid">-</b></div>
                <button type="button" class="bo-copy" id="bo-copy" onclick="app.banCopy()">Copy</button>
            </div>

            <div class="bo-rows">
                <div><span>Ban length</span><b id="bo-len" class="bo-red">-</b></div>
                <div id="bo-left-row"><span>Back in</span><b id="bo-left" class="bo-amber">-</b></div>
                <div id="bo-reason-row"><span>Reason</span><b id="bo-reason">-</b></div>
            </div>

            <div class="bo-btns">
                <button type="button" class="bo-btn bo-main" onclick="app.banSupport('wa')"><i class="fa-brands fa-whatsapp"></i> Contact support</button>
                <button type="button" class="bo-btn" id="bo-tg" onclick="app.banSupport('tg')" style="display:none"><i class="fa-brands fa-telegram"></i> Telegram support</button>
            </div>
            <p class="bo-note">Think this is a mistake? Message support and share your Player ID.</p>
        </div>
    </div>
</div>
